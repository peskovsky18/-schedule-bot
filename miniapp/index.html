<!DOCTYPE html>
<html lang="ru" data-scheme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0e1116">
  <title>Расписание</title>
  <meta name="description" content="Расписание занятий группы — Telegram Mini App">

  <!--
    ?v=4 — обход кэша. Ассеты отдаются с no-cache (см. _headers), так что
    поднимать номер не обязательно: он нужен был, чтобы сбросить файлы,
    закэшированные раньше с max-age=3600. Если меняете файлы в assets/
    и хотите гарантию — увеличьте число.
  -->
  <link rel="stylesheet" href="assets/css/styles.css?v=4">

  <!-- Официальный SDK Telegram Mini Apps: даёт тему, размеры и openLink -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

  <div class="app">

    <header class="appbar">
      <div class="appbar__titles">
        <h1 class="appbar__group" id="group">Расписание</h1>
        <div class="appbar__sub" id="groupSub" hidden></div>
      </div>

      <button class="icon-btn" id="refresh" type="button" title="Обновить" aria-label="Обновить расписание">
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path fill="currentColor" d="M12 5V1L7 6l5 5V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/>
        </svg>
      </button>

      <button
        class="icon-btn"
        id="menuBtn"
        type="button"
        title="Меню"
        aria-label="Меню"
        aria-expanded="false"
        aria-controls="menu"
      >
        <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
          <path fill="currentColor" d="M4 6h16v2H4zM4 11h16v2H4zM4 16h16v2H4z"/>
        </svg>
      </button>
    </header>

    <nav class="segmented" id="segments" aria-label="Период"></nav>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <main class="days" id="days"></main>

  </div>

  <!-- Затемнение под меню -->
  <div class="menu-backdrop" id="menuBackdrop" hidden></div>

  <!--
    Меню. Выезжает справа от кнопки в шапке.
    Разделы расписания переключают основную вкладку, «Треки» — плеер.
  -->
  <aside class="menu" id="menu" hidden aria-label="Меню">
    <div class="menu__head">
      <span class="menu__caption">Меню</span>
      <button class="menu__close" id="menuClose" type="button" aria-label="Закрыть меню">✕</button>
    </div>

    <div class="menu__scroll">
      <div class="menu__section">Расписание</div>
      <div class="menu__nav" id="menuNav">
        <button class="menu__item" type="button" data-mode="week">Неделя</button>
        <button class="menu__item" type="button" data-mode="next">Следующая неделя</button>
        <button class="menu__item" type="button" data-mode="all">Всё расписание</button>
      </div>

      <div class="menu__section">Шахматы</div>
      <div class="chess" id="chess">
        <!-- Партии ещё нет -->
        <div class="chess__intro" id="chessIntro" hidden>
          <p class="chess__hint">
            Сыграйте с одногруппником. Вы играете белыми и делаете первый ход.
          </p>
          <button class="chess__btn" id="chessNew" type="button">Создать партию</button>
        </div>

        <!-- Идёт партия -->
        <div class="chess__game" id="chessGame" hidden>
          <div class="chess__players">
            <span class="chess__player" id="chessWhite"></span>
            <span class="chess__player" id="chessBlack"></span>
          </div>

          <div class="chess__board" id="chessBoard" role="grid"
               aria-label="Шахматная доска"></div>

          <div class="chess__turn" id="chessTurn" role="status" aria-live="polite"></div>

          <div class="chess__actions">
            <button class="chess__btn chess__btn--ghost" id="chessInvite" type="button" hidden>
              Пригласить
            </button>
            <button class="chess__btn chess__btn--ghost" id="chessCancel" type="button" hidden>
              Отменить партию
            </button>
            <button class="chess__btn chess__btn--ghost" id="chessResign" type="button" hidden>
              Сдаться
            </button>
            <button class="chess__btn chess__btn--ghost" id="chessAgain" type="button" hidden>
              Новая партия
            </button>
          </div>
        </div>

        <!-- Выбор фигуры при превращении пешки -->
        <div class="chess__promo" id="chessPromo" hidden>
          <div class="chess__promo-title">Во что превратить пешку?</div>
          <div class="chess__promo-list" id="chessPromoList"></div>
        </div>

        <p class="chess__error" id="chessError" hidden></p>
      </div>

      <div class="menu__section">Рулетка</div>
      <div class="roulette" id="roulette">
        <div class="wheel">
          <div class="wheel__disc" id="rouletteWheel"></div>
          <div class="wheel__hub" aria-hidden="true"></div>
          <div class="wheel__pointer" aria-hidden="true"></div>
        </div>

        <button class="roulette__spin" id="rouletteSpin" type="button">Крутить</button>
        <div class="roulette__result" id="rouletteResult" role="status" aria-live="polite"></div>
      </div>

      <div class="menu__section">Треки</div>
      <div class="tracks" id="tracks"></div>
    </div>
  </aside>

  <script src="assets/js/config.js?v=6"></script>
  <script src="assets/js/core.js?v=6"></script>
  <script src="assets/js/chess.js?v=6"></script>
  <script src="assets/js/app.js?v=6"></script>
</body>
</html>
