# Netlify: публикуем статику мини-приложения.
#
# Важно: base directory в настройках сайта нужно указать как `miniapp`.
# Тогда Netlify возьмёт этот файл и опубликует содержимое папки.

[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Заголовки X-Frame-Options и frame-ancestors здесь намеренно НЕ задаются.
# Telegram Web (web.telegram.org) открывает мини-приложения внутри iframe,
# и запрет на встраивание сломал бы приложение в веб-версии.

# Аудио — единственный ресурс с настоящим кэшем: файл большой и меняется
# редко. Правило идёт раньше /assets/*: при совпадении выигрывает первое.
[[headers]]
  for = "/assets/audio/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Кэширования нет ни для чего остального. Приложение крошечное
# (около 30 КБ), экономить тут нечего, а Telegram агрессивно кэширует
# мини-приложения: с max-age=3600 он показывал старый app.js до часа,
# и обновления не доходили до людей.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
